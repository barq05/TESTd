;border-top:1px solid var(--edge);font-size:.78rem;line-height:1.6;color:var(--mute);max-width:80ch}\n\n\n\n.links{order:2}\n.lang-btn{order:3;min-height:40px;min-width:52px;padding:0 14px;background:transparent;border:1px solid var(--edge-hi);color:var(--glow);font:700 .78rem/1 var(--mono);letter-spacing:.14em;cursor:pointer;transition:background .2s,color .2s}\n.lang-btn:hover{background:var(--neon);color:#1a0310}\n.menu-btn{order:4}\n.preview{unicode-bidi:plaintext;text-align:start}\n.rank-detail .rn{font-family:var(--display-latin)}\nhtml[dir=\"rtl\"] select{background-position:left 14px center}\n\n\nhtml[lang=\"ar\"]{--display:'Lalezar','Big Shoulders Display',Impact,sans-serif;--body:'Tajawal','Hanken Grotesk',system-ui,sans-serif;--mono:'Tajawal','JetBrains Mono',ui-monospace,monospace}\nhtml[lang=\"ar\"] *{letter-spacing:0!important}\nhtml[lang=\"ar\"] body{font-size:1.06rem;line-height:1.75}\nhtml[lang=\"ar\"] :is(h2,h3,.tagline,.stat b,.steps b,.r-title){font-weight:400;line-height:1.3}\nhtml[lang=\"ar\"] h2{font-size:clamp(2.4rem,6vw,4.4rem)}\nhtml[lang=\"ar\"] .card h3{font-size:1.65rem}\nhtml[lang=\"ar\"] .tagline{font-size:clamp(1.5rem,3.2vw,2.2rem);line-height:1.35}\nhtml[lang=\"ar\"] .r-title{font-size:1.4rem}\nhtml[lang=\"ar\"] .tl-item h3{font-size:1.75rem}\nhtml[lang=\"ar\"] .plate h3{font-size:1.9rem}\nhtml[lang=\"ar\"] .form-card h3{font-size:2rem}\nhtml[lang=\"ar\"] .sub{font-size:1.5rem}\nhtml[lang=\"ar\"] :is(.member h3,.m-avatar b,.rank-detail .rn,.t-name){font-weight:800;line-height:1}\nhtml[lang=\"ar\"] .m-avatar b{font-weight:900}\nhtml[lang=\"ar\"] .wordmark{line-height:.85}\nhtml[lang=\"ar\"] :is(.eyebrow,.links a,.chip,.btn,.lang-btn,.menu-btn,.field label,.stat span,.t-en,.t-seats,.tl-date,.p-kicker,.block-title,.steps span,.preview-label,.count,.m-meta dt,.member .alias,.r-id,.m-top,.rank-detail .kicker){font-size:.9rem}\nhtml[lang=\"ar\"] .lede{font-size:1.12rem}\nhtml[lang=\"ar\"] .eyebrow,html[lang=\"ar\"] .btn,html[lang=\"ar\"] .block-title{font-weight:700}\n\n@media (max-width:900px){\n  .hero-grid,.grid-2,.hier-grid,.hist-grid,.join-grid{grid-template-columns:minmax(0,1fr)}\n  .crest{width:min(78%,380px)}\n  .rank-detail{min-height:0}\n}\n@media (max-width:820px){\n  .menu-btn{display:inline-flex}\n  .links{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;align-items:stretch;gap:0;background:var(--wine-950);border-bottom:1px solid var(--edge);padding:8px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px))}\n  .top.open .links{display:flex}\n  .links a{padding:15px 0;border-bottom:1px solid var(--edge)}\n  .links a.cta-sm{margin-top:14px;padding:15px;text-align:center;border:0}\n}\n@media (max-width:700px){\n  .strip-grid{grid-template-columns:repeat(2,minmax(0,1fr))}\n  .stat:nth-child(3){border-inline-start:0;padding-inline-start:0}\n  .stat:nth-child(n+3){border-top:1px solid var(--edge)}\n  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}\n}\n@media (max-width:560px){\n  .form-grid,.ach-grid{grid-template-columns:minmax(0,1fr)}\n  .rule p{padding-inline-start:4px}\n  .btn{width:100%}\n}\n@media (prefers-reduced-motion:reduce){\n  html{scroll-behavior:auto}\n  *,*::before,*::after{animation:none!important;transition:none!important}\n}\n", "body": "\u003cdiv class=\"grain\" aria-hidden=\"true\">\u003c/div>\n\n\u003cheader class=\"top\" id=\"top\">\n  \u003cdiv class=\"wrap top-in\">\n    \u003ca class=\"brand\" href=\"#home\" aria-label=\"Favelas، العودة إلى الأعلى\">\n      \u003cspan class=\"brand-mark\" role=\"img\" aria-label=\"شعار Favelas\">\u003c/span>\n      \u003cspan class=\"brand-name\">Favelas\u003c/span>\n    \u003c/a>\n    \u003cbutton class=\"menu-btn\" id=\"menuBtn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"navLinks\">القائمة\u003c/button>\n    \u003cnav class=\"links\" id=\"navLinks\" aria-label=\"التنقل الرئيسي\">\n      \u003ca href=\"#about\" data-i=\"nav_about\">عن العائلة\u003c/a>\n      \u003ca href=\"#family\" data-i=\"nav_family\">الأعضاء\u003c/a>\n      \u003ca href=\"#hierarchy\" data-i=\"nav_ranks\">الرتب\u003c/a>\n      \u003ca href=\"#history\" data-i=\"nav_history\">التاريخ\u003c/a>\n      \u003ca class=\"cta-sm\" href=\"#join\" data-i=\"nav_join\">انضم\u003c/a>\n    \u003c/nav>\n  \u003c/div>\n\u003c/header>\n\n\u003cmain id=\"home\">\n  \u003csection class=\"hero\" aria-labelledby=\"h1\">\n    \u003ccanvas id=\"sky\" aria-hidden=\"true\">\u003c/canvas>\n    \u003cspan class=\"orn orn-tl\" aria-hidden=\"true\">\u003c/span>\n    \u003cspan class=\"orn orn-tr\" aria-hidden=\"true\">\u003c/span>\n    \u003cdiv class=\"wrap hero-grid\" id=\"heroGrid\">\n      \u003cdiv class=\"hero-copy\">\n        \u003cp class=\"eyebrow\" data-i=\"hero_eyebrow\">عائلة جي تي إيه رول بلاي · لوس سانتوس\u003c/p>\n        \u003ch1 class=\"wordmark\" id=\"h1\">Favelas\u003c/h1>\n        \u003cp class=\"tagline\" data-i=\"hero_tag\">وُلدنا على التل. بُنينا على الولاء.\u003c/p>\n        \u003cp class=\"lede\" data-i=\"hero_lede\">Favelas عائلة رول بلاي في جي تي إيه من قلب لوس سانتوس. نحكم التل، ونحمي أهلنا، ونلعب كل مشهد من أجل القصة. الباب مفتوح للأشخاص المناسبين.\u003c/p>\n        \u003cdiv class=\"actions\">\n          \u003ca class=\"btn btn-primary notch\" href=\"#join\" data-i=\"btn_join\">انضم للعائلة\u003c/a>\n          \u003ca class=\"btn btn-ghost notch\" href=\"#family\" data-i=\"btn_crew\">قابل الطاقم\u003c/a>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"crest\" id=\"crest\">\n        \u003cdiv class=\"crest-glow\">\u003c/div>\n        \u003cdiv class=\"crest-img\" role=\"img\" aria-label=\"شعار عائلة Favelas\">\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003cdiv class=\"strip\">\n    \u003cdiv class=\"wrap strip-grid\">\n      \u003cdiv class=\"stat\">\u003cb data-i=\"st1_v\">2025\u003c/b>\u003cspan data-i=\"st1\">سنة التأسيس\u003c/span>\u003c/div>\n      \u003cdiv class=\"stat\">\u003cb data-i=\"st2_v\">32\u003c/b>\u003cspan data-i=\"st2\">عضو نشط\u003c/span>\u003c/div>\n      \u003cdiv class=\"stat\">\u003cb data-i=\"st3_v\">9\u003c/b>\u003cspan data-i=\"st3\">منطقة تحت سيطرتنا\u003c/span>\u003c/div>\n      \u003cdiv class=\"stat\">\u003cb data-i=\"st4_v\">14\u003c/b>\u003cspan data-i=\"st4\">عملية سطو\u003c/span>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003csection class=\"sec\" id=\"about\" aria-labelledby=\"about-h\">\n    \u003cdiv class=\"wrap grid-2\">\n      \u003cdiv class=\"about-copy rv\">\n        \u003cp class=\"eyebrow\" data-i=\"about_eyebrow\">عن العائلة\u003c/p>\n        \u003ch2 id=\"about-h\" data-i=\"about_h\">وُلدنا على التل\u003c/h2>\n        \u003cp data-i=\"about_p1\">بدأت Favelas بستة أصدقاء، وشقة مستعارة في ديفيس، وسيارة سلطان مهترئة. كل رتبة في العائلة اليوم تعود إلى تلك الليلة الأولى.\u003c/p>\n        \u003cp data-i=\"about_p2\">نلعب من أجل القصة. السطو والمطاردات والجلسات المغلقة مبنية حول الشخصيات التي فيها، ولكل عضو صوت على الطاولة. ندعم أهلنا، ونحل مشاكلنا داخل المشهد، ولا نترك أحدًا خلفنا.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"code-list\">\n        \u003carticle class=\"card notch\">\u003ch3 data-i=\"c1_h\">العائلة قبل كل شيء\u003c/h3>\u003cp data-i=\"c1_p\">حين يسقط واحد منا يتحرك التل كله. لا أحد يُترك في زنزانة أو على الرصيف.\u003c/p>\u003c/article>\n        \u003carticle class=\"card notch\">\u003ch3 data-i=\"c2_h\">الاحترام يُكتسب داخل المشهد\u003c/h3>\u003cp data-i=\"c2_p\">الرول بلاي أولًا والسلاح ثانيًا. السمعة التي تُبنى بالشخصية هي الوحيدة التي تُحسب.\u003c/p>\u003c/article>\n        \u003carticle class=\"card notch\">\u003ch3 data-i=\"c3_h\">اشتغل بخطة\u003c/h3>\u003cp data-i=\"c3_p\">لا فوضى عشوائية. لكل حركة هدف وفريق وطريق للخروج.\u003c/p>\u003c/article>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"sec\" id=\"family\" aria-labelledby=\"family-h\" style=\"background:linear-gradient(var(--void),var(--wine-950) 30%,var(--void))\">\n    \u003cdiv class=\"wrap\">\n      \u003cdiv class=\"sec-head\">\n        \u003cdiv class=\"sec-head-row\">\n          \u003cdiv>\n            \u003cp class=\"eyebrow\" data-i=\"family_eyebrow\">أعضاء العائلة\u003c/p>\n            \u003ch2 id=\"family-h\" data-i=\"family_h\">الطاقم\u003c/h2>\n          \u003c/div>\n          \u003cdiv class=\"filters\" id=\"filters\" role=\"group\" aria-label=\"تصفية الأعضاء حسب المجموعة\">\u003c/div>\n        \u003c/div>\n        \u003cp class=\"lede\" data-i=\"family_lede\">وجوه من كل الرتب. كل واحد منهم استحق الألوان.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"member-grid\" id=\"memberGrid\">\u003c/div>\n      \u003cp class=\"count\" id=\"memberCount\" aria-live=\"polite\">\u003c/p>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"sec\" id=\"hierarchy\" aria-labelledby=\"hier-h\">\n    \u003cdiv class=\"wrap\">\n      \u003cdiv class=\"sec-head\">\n        \u003cp class=\"eyebrow\" data-i=\"hier_eyebrow\">النظام على التل\u003c/p>\n        \u003ch2 id=\"hier-h\" data-i=\"hier_h\">الرتب والقانون\u003c/h2>\n        \u003cp class=\"lede\" data-i=\"hier_lede\">الكل يعرف مكانه. اختر رتبة لتعرف ما تطلبه منك.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"hier-grid\">\n        \u003cdiv>\n          \u003cdiv class=\"pyramid\" id=\"pyramid\" role=\"group\" aria-label=\"رتب العائلة\">\u003c/div>\n          \u003cdiv class=\"card notch rank-detail\" id=\"rankDetail\" aria-live=\"polite\">\u003c/div>\n        \u003c/div>\n        \u003cdiv>\n          \u003ch3 class=\"sub\" data-i=\"hier_sub\">القانون\u003c/h3>\n          \u003cdiv id=\"rules\">\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"sec\" id=\"history\" aria-labelledby=\"hist-h\" style=\"background:linear-gradient(var(--void),var(--wine-950) 30%,var(--void))\">\n    \u003cdiv class=\"wrap\">\n      \u003cdiv class=\"sec-head\">\n        \u003cp class=\"eyebrow\" data-i=\"hist_eyebrow\">الإنجازات والتاريخ\u003c/p>\n        \u003ch2 id=\"hist-h\" data-i=\"hist_h\">التاريخ والانتصارات\u003c/h2>\n        \u003cp class=\"lede\" data-i=\"hist_lede\">من مبنى سكني واحد إلى قمة ترتيب السيرفر.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"hist-grid\">\n        \u003col class=\"timeline\" id=\"timeline\">\u003c/ol>\n        \u003cdiv class=\"ach-grid\" id=\"achievements\">\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"sec join\" id=\"join\" aria-labelledby=\"join-h\">\n    \u003cspan class=\"orn orn-br\" aria-hidden=\"true\">\u003c/span>\n    \u003cdiv class=\"wrap join-grid\">\n      \u003cdiv class=\"join-copy\">\n        \u003cdiv class=\"rv\">\n          \u003cp class=\"eyebrow\" data-i=\"join_eyebrow\">باب الانضمام\u003c/p>\n          \u003ch2 id=\"join-h\" data-i=\"join_h\">انضم للعائلة\u003c/h2>\n          \u003cp class=\"lede\" style=\"margin-top:18px\" data-i=\"join_lede\">باب الانضمام مفتوح. نبحث عن لاعبين يلتزمون بالشخصية، ويحضرون، ويقدّمون العائلة على أي شيء.\u003c/p>\n        \u003c/div>\n        \u003cdiv>\n          \u003cp class=\"block-title\" data-i=\"req_title\">ما الذي نبحث عنه\u003c/p>\n          \u003cul class=\"reqs\" id=\"reqs\">\u003c/ul>\n        \u003c/div>\n        \u003cdiv>\n          \u003cp class=\"block-title\" data-i=\"steps_title\">كيف يتم الأمر\u003c/p>\n          \u003col class=\"steps\" id=\"steps\">\u003c/ol>\n        \u003c/div>\n      \u003c/div>\n      \u003cform class=\"card notch form-card\" id=\"appForm\" novalidate>\n        \u003ch3 data-i=\"form_h\">جهّز طلبك\u003c/h3>\n        \u003cp data-i=\"form_p\">املأ البيانات وانسخ النص الناتج، ثم الصقه في تذكرة تقديم داخل ديسكورد العائلة.\u003c/p>\n        \u003cdiv class=\"form-grid\">\n          \u003cdiv class=\"field\">\u003clabel for=\"f-discord\" data-i=\"lb_discord\">اسم ديسكورد\u003c/label>\u003cinput id=\"f-discord\" type=\"text\" dir=\"auto\" autocomplete=\"off\" placeholder=\"اسمك\" data-ip=\"ph_discord\">\u003c/div>\n          \u003cdiv class=\"field\">\u003clabel for=\"f-char\" data-i=\"lb_char\">اسم الشخصية\u003c/label>\u003cinput id=\"f-char\" type=\"text\" dir=\"auto\" autocomplete=\"off\" placeholder=\"الاسم الأول واسم العائلة\" data-ip=\"ph_char\">\u003c/div>\n          \u003cdiv class=\"field\">\u003clabel for=\"f-exp\" data-i=\"lb_exp\">الخبرة في الرول بلاي\u003c/label>\n            \u003cselect id=\"f-exp\">\u003c/select>\u003c/div>\n          \u003cdiv class=\"field\">\u003clabel for=\"f-hrs\" data-i=\"lb_hrs\">ساعات اللعب أسبوعيًا\u003c/label>\n            \u003cselect id=\"f-hrs\">\u003c/select>\u003c/div>\n          \u003cdiv class=\"field wide\">\u003clabel for=\"f-role\" data-i=\"lb_role\">الدور المفضل\u003c/label>\n            \u003cselect id=\"f-role\">\u003c/select>\u003c/div>\n          \u003cdiv class=\"field wide\">\u003clabel for=\"f-why\" data-i=\"lb_why\">لماذا Favelas؟\u003c/label>\u003ctextarea id=\"f-why\" dir=\"auto\" maxlength=\"600\" placeholder=\"حدثنا عن شخصيتك وما ستضيفه للعائلة.\" data-ip=\"ph_why\">\u003c/textarea>\u003c/div>\n        \u003c/div>\n        \u003cp class=\"preview-label\" data-i=\"preview_label\">طلبك\u003c/p>\n        \u003cpre class=\"preview\" id=\"appPreview\" tabindex=\"0\" aria-label=\"معاينة نص الطلب\">\u003c/pre>\n        \u003cdiv class=\"form-actions\">\n          \u003cbutton class=\"btn btn-primary notch\" id=\"copyBtn\" type=\"button\" data-i=\"copy_btn\">انسخ الطلب\u003c/button>\n          \u003ca class=\"btn btn-ghost notch\" id=\"discordBtn\" href=\"#join\" target=\"_blank\" rel=\"noopener\" hidden data-i=\"discord_btn\">افتح ديسكورد\u003c/a>\n        \u003c/div>\n        \u003cp class=\"note\" id=\"copyNote\" role=\"status\">\u003c/p>\n        \u003cp class=\"fineprint\" data-i=\"fine\">هذه الصفحة لا ترسل أي شيء. طلبك يصل إلى العائلة فقط عندما تلصقه في ديسكورد.\u003c/p>\n      \u003c/form>\n    \u003c/div>\n  \u003c/section>\n\u003c/main>\n\n\u003cfooter class=\"foot\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"foot-grid\">\n      \u003cdiv>\n        \u003ca class=\"brand\" href=\"#home\" aria-label=\"Favelas، العودة إلى الأعلى\">\u003cspan class=\"brand-mark\" role=\"img\" aria-label=\"شعار Favelas\">\u003c/span>\u003cspan class=\"brand-name\">Favelas\u003c/span>\u003c/a>\n        \u003cp class=\"foot-copy\" data-i=\"foot_copy\">لوس سانتوس لا تنام، والتل كذلك.\u003c/p>\n      \u003c/div>\n      \u003cnav aria-label=\"روابط التذييل\">\u003ca href=\"#about\" data-i=\"nav_about\">عن العائلة\u003c/a>\u003ca href=\"#family\" data-i=\"nav_family\">الأعضاء\u003c/a>\u003ca href=\"#hierarchy\" data-i=\"nav_ranks\">الرتب\u003c/a>\u003ca href=\"#history\" data-i=\"nav_history\">التاريخ\u003c/a>\u003ca href=\"#join\" data-i=\"nav_join\">انضم\u003c/a>\u003c/nav>\n    \u003c/div>\n    \u003cp class=\"legal\" id=\"legal\">\u003c/p>\n  \u003c/div>\n\u003c/footer>\n\n", "js": "const FAMILY=FV.family,UI_AR=FV.uiAr;\nconst S = {\n  ar: {\n    menu: 'القائمة', close: 'إغلاق', aka: 'المعروف بـ', rank: 'الرتبة', role: 'الدور', joined: 'الانضمام',\n    online: 'متصل', away: 'بعيد', offline: 'غير متصل',\n    showing: (a, b) => 'عرض ' + a + ' من ' + b,\n    copied: 'تم النسخ. الصق الطلب في تذكرة التقديم على ديسكورد.',\n    selected: 'تم تحديد النص. انسخه الآن من قائمة جهازك.',\n    \n    legal: y => FAMILY.name + ' عائلة رول بلاي خيالية. هذا الموقع غير تابع لـ روكستار جيمز أو تيك-تو إنتراكتيف، ولا معتمد منهما أو مرتبط بهما. © ' + y + ' ' + FAMILY.name + '.',\n    app: { title: 'طلب انضمام إلى ' + FAMILY.name, discord: 'ديسكورد', char: 'الشخصية', exp: 'الخبرة في الرول بلاي', hrs: 'الساعات أسبوعيًا', role: 'الدور المفضل', why: 'لماذا ' + FAMILY.name + '؟' }\n  }\n};\n\nconst $ = (s, r = document) => r.querySelector(s);\nconst $$ = (s, r = document) => Array.from(r.querySelectorAll(s));\nconst esc = s => String(s).replace(/[&\u003c>\"']/g, c => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\nconst reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches||!!FV.theme.noAnim;\nif (!reduceMotion) document.documentElement.classList.add('js');\n\n\nlet lang = 'ar';\n\nconst s = k => S[lang][k];\nconst tr = (item, key) => (lang === 'ar' && item.ar && item.ar[key] != null) ? item.ar[key] : item[key];\n\n\nconst EN_UI = {}, EN_PH = {};\n$$('[data-i]').forEach(el => { EN_UI[el.dataset.i] = el.textContent.trim(); });\n$$('[data-ip]').forEach(el => { EN_PH[el.dataset.ip] = el.getAttribute('placeholder'); });\n\nlet memberFilter = 'all', rankIndex = 0;\n\nfunction renderStatic() {\n  const root = document.documentElement;\n  root.lang = lang; root.dir = lang === 'ar' ? 'rtl' : 'ltr';\n  $$('[data-i]').forEach(el => { el.textContent = lang === 'ar' ? (UI_AR[el.dataset.i] ?? EN_UI[el.dataset.i]) : EN_UI[el.dataset.i]; });\n  $$('[data-ip]').forEach(el => { el.setAttribute('placeholder', lang === 'ar' ? UI_AR[el.dataset.ip] : EN_PH[el.dataset.ip]); });\n  const open = $('#top').classList.contains('open');\n  $('#menuBtn').textContent = open ? s('close') : s('menu');\n  $('#legal').textContent = s('legal')(new Date().getFullYear());\n}\n\nfunction renderMembers() {\n  const grid = $('#memberGrid'), filters = $('#filters');\n  const st = { online: s('online'), away: s('away'), offline: s('offline') };\n  grid.innerHTML = FAMILY.members.map(m => `\n    \u003carticle class=\"card notch member${m.tier === 'leadership' ? ' is-lead' : ''}\" data-tier=\"${esc(m.tier)}\">\n      \u003cdiv class=\"m-top\">\u003cspan>${esc(m.id)}\u003c/span>\u003cspan class=\"status s-${esc(m.status)}\">\u003ci>\u003c/i>${esc(st[m.status] || '')}\u003c/span>\u003c/div>\n      \u003cdiv class=\"m-avatar\" aria-hidden=\"true\">${m.img?`\u003cimg src=\"${esc(m.img)}\" alt=\"\" style=\"width:100%;height:100%;object-fit:cover\">`:`\u003cb>${esc(m.alias.charAt(0))}\u003c/b>`}\u003c/div>\n      \u003ch3>${esc(m.name)}\u003c/h3>\n      \u003cp class=\"alias\">${esc(s('aka'))} ${esc(m.alias)}\u003c/p>\n      \u003cdl class=\"m-meta\">\n        \u003cdiv>\u003cdt>${esc(s('rank'))}\u003c/dt>\u003cdd>${esc(m.rank)}\u003c/dd>\u003c/div>\n        \u003cdiv>\u003cdt>${esc(s('role'))}\u003c/dt>\u003cdd>${esc(tr(m, 'role'))}\u003c/dd>\u003c/div>\n        \u003cdiv>\u003cdt>${esc(s('joined'))}\u003c/dt>\u003cdd>${esc(tr(m, 'joined'))}\u003c/dd>\u003c/div>\n      \u003c/dl>\n    \u003c/article>`).join('');\n  filters.innerHTML = FAMILY.tiers.map(t => {\n    const n = t.key === 'all' ? FAMILY.members.length : FAMILY.members.filter(m => m.tier === t.key).length;\n    return `\u003cbutton class=\"chip notch\" type=\"button\" data-key=\"${esc(t.key)}\" aria-pressed=\"false\">${esc(tr(t, 'label'))} ${n}\u003c/button>`;\n  }).join('');\n  applyFilter(memberFilter);\n}\nfunction applyFilter(key) {\n  memberFilter = key;\n  let shown = 0;\n  $$('#memberGrid .member').forEach(c => { const ok = key === 'all' || c.dataset.tier === key; c.hidden = !ok; if (ok) shown++; });\n  $$('#filters .chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.key === key)));\n  $('#memberCount').textContent = s('showing')(shown, FAMILY.members.length);\n}\n\nfunction renderRanks() {\n  const pyramid = $('#pyramid');\n  pyramid.innerHTML = FAMILY.ranks.map((r, i) => `\n    \u003cbutton class=\"tier notch\" type=\"button\" data-i=\"${i}\" style=\"--w0:${esc(r.w)}\" aria-pressed=\"false\">\n      \u003cspan>\u003cspan class=\"t-name\">${esc(r.name)}\u003c/span>\u003cspan class=\"t-en\">${esc(tr(r, 'en'))}\u003c/span>\u003c/span>\n      \u003cspan class=\"t-seats\">${esc(tr(r, 'seats'))}\u003c/span>\n    \u003c/button>`).join('');\n  showRank(rankIndex);\n  $('#rules').innerHTML = FAMILY.rules.map((r, i) => `\n    \u003cdetails class=\"rule\"${i === 0 ? ' open' : ''}>\n      \u003csummary>\u003cspan class=\"r-id\">${esc(r.id)}\u003c/span>\u003cspan class=\"r-title\">${esc(tr(r, 'title'))}\u003c/span>\u003cspan class=\"r-plus\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\n      \u003cp>${esc(tr(r, 'text'))}\u003c/p>\n    \u003c/details>`).join('');\n}\nfunction showRank(i) {\n  rankIndex = i;\n  const r = FAMILY.ranks[i];\n  $('#rankDetail').innerHTML = `\u003cp class=\"kicker\">${esc(tr(r, 'en'))} · ${esc(tr(r, 'seats'))}\u003c/p>\u003ch3 class=\"rn\">${esc(r.name)}\u003c/h3>\u003cp>${esc(tr(r, 'text'))}\u003c/p>`;\n  $$('#pyramid .tier').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.i) === i)));\n}\n\nfunction renderLists() {\n  $('#timeline').innerHTML = FAMILY.timeline.map(t => `\u003cli class=\"tl-item\">\u003cspan class=\"tl-date\">${esc(tr(t, 'date'))}\u003c/span>\u003ch3>${esc(tr(t, 'title'))}\u003c/h3>\u003cp>${esc(tr(t, 'text'))}\u003c/p>\u003c/li>`).join('');\n  $('#achievements').innerHTML = FAMILY.achievements.map(a => `\u003carticle class=\"card notch plate\">\u003cp class=\"p-kicker\">${esc(tr(a, 'kicker'))}\u003c/p>\u003ch3>${esc(tr(a, 'title'))}\u003c/h3>\u003cp>${esc(tr(a, 'text'))}\u003c/p>\u003c/article>`).join('');\n  $('#reqs').innerHTML = FAMILY.requirements.map(r => `\u003cli>\u003cspan class=\"tick\" aria-hidden=\"true\">\u003c/span>\u003cspan>${esc(r.t)}\u003c/span>\u003c/li>`).join('');\n  $('#steps').innerHTML = FAMILY.steps.map(x => `\u003cli>\u003cb>${esc(x.n)}\u003c/b>\u003cspan>${esc(x.t)}\u003c/span>\u003c/li>`).join('');\n}\n\n\nconst fields = { discord: $('#f-discord'), char: $('#f-char'), exp: $('#f-exp'), hrs: $('#f-hrs'), role: $('#f-role'), why: $('#f-why') };\nfunction renderSelects() {\n  ['exp', 'hrs', 'role'].forEach(k => {\n    const el = fields[k], idx = Math.max(0, el.selectedIndex);\n    el.innerHTML = FAMILY.options[k][lang].map(o => `\u003coption>${esc(o)}\u003c/option>`).join('');\n    el.selectedIndex = idx;\n  });\n}\nfunction compose() {\n  const L = s('app');\n  const v = el => (el.tagName === 'SELECT' ? el.options[el.selectedIndex].text : el.value).trim() || '-';\n  return [\n    L.title, '',\n    L.discord + ': ' + v(fields.discord), L.char + ': ' + v(fields.char),\n    L.exp + ': ' + v(fields.exp), L.hrs + ': ' + v(fields.hrs),\n    L.role + ': ' + v(fields.role), '', L.why, v(fields.why)\n  ].join('\\n');\n}\nfunction renderPreview() { $('#appPreview').textContent = compose(); }\n\nfunction renderAll() {\n  renderStatic(); renderMembers(); renderRanks(); renderLists(); renderSelects(); renderPreview();\n  $('#copyNote').textContent = '';\n}\n\n\n(function wire() {\n  const top = $('#top'), menu = $('#menuBtn');\n  const setMenu = open => { top.classList.toggle('open', open); menu.setAttribute('aria-expanded', String(open)); menu.textContent = open ? s('close') : s('menu'); };\n  menu.addEventListener('click', () => setMenu(!top.classList.contains('open')));\n  $$('#navLinks a').forEach(a => a.addEventListener('click', () => setMenu(false)));\n  \n  $('#filters').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) applyFilter(b.dataset.key); });\n  $('#pyramid').addEventListener('click', e => { const b = e.target.closest('.tier'); if (b) showRank(Number(b.dataset.i)); });\n  Object.values(fields).forEach(el => el.addEventListener('input', () => { renderPreview(); $('#copyNote').textContent = ''; }));\n  $('#appForm').addEventListener('submit', e => e.preventDefault());\n  $('#copyBtn').addEventListener('click', async () => {\n    const note = $('#copyNote'), pv = $('#appPreview');\n    try {\n      await navigator.clipboard.writeText(compose());\n      note.textContent = s('copied');\n    } catch (err) {\n      const range = document.createRange(); range.selectNodeContents(pv);\n      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);\n      note.textContent = s('selected');\n    }\n  });\n  if (FAMILY.discordInvite) { const d = $('#discordBtn'); d.href = FAMILY.discordInvite; d.hidden = false; }\n})();\n\nrenderAll();\n\n\n(function reveal() {\n  const els = $$('.sec-head, .card, .tl-item, .rule, .tier, .steps li, .reqs li');\n  els.forEach(el => el.classList.add('rv'));\n  if (reduceMotion || !('IntersectionObserver' in window)) { els.forEach(el => el.classList.add('in')); return; }\n  const io = new IntersectionObserver(entries => entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } }), { threshold: 0.08, rootMargin: '0px 0px -6% 0px' });\n  els.forEach(el => io.observe(el));\n})();\n\n\n(function tilt() {\n  const crest = $('#crest'), hero = $('.hero');\n  if (!crest || reduceMotion || !matchMedia('(pointer:fine)').matches) return;\n  hero.addEventListener('pointermove', e => {\n    const r = hero.getBoundingClientRect();\n    const nx = (e.clientX - r.left) / r.width - 0.5, ny = (e.clientY - r.top) / r.height - 0.5;\n    crest.style.setProperty('--tx', (nx * -18).toFixed(1) + 'px');\n    crest.style.setProperty('--ty', (ny * -14).toFixed(1) + 'px');\n  });\n})();\n\n\n(function hillside() {\n  const cv = $('#sky'); if (!cv || !cv.getContext) return;\n  const ctx = cv.getContext('2d');\n  let W = 0, H = 0, layers = [], embers = [], raf = 0, last = 0;\n  const rng = seed => { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); };\n  const defs = [\n    { fill: '#260b1c', rim: 'rgba(255,110,170,.24)', lit: .10, hMin: .50, hMax: 1.0, wMin: 34, wMax: 80 },\n    { fill: '#16050f', rim: 'rgba(255,110,170,.18)', lit: .16, hMin: .32, hMax: .72, wMin: 30, wMax: 68 },\n    { fill: '#08020a', rim: 'rgba(255,110,170,.10)', lit: .24, hMin: .16, hMax: .46, wMin: 26, wMax: 58 }\n  ];\n  function build() {\n    const dpr = Math.min(window.devicePixelRatio || 1, 2);\n    const r = cv.getBoundingClientRect();\n    W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));\n    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);\n    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n    const rand = rng(1999), skyH = Math.min(300, H * 0.4);\n    layers = defs.map(d => {\n      const houses = [], wins = [];\n      let x = -20;\n      while (x \u003c W + 20) {\n        const w = d.wMin + rand() * (d.wMax - d.wMin);\n        const t = Math.min(1, Math.max(0, (x + w / 2) / W));\n        const hill = 0.38 + 0.62 * Math.exp(-Math.pow((t - 0.7) / 0.34, 2));\n        const hl = skyH * (d.hMin + rand() * (d.hMax - d.hMin)) * hill + 12;\n        const slant = rand() \u003c 0.4 ? 5 + rand() * 10 : 0;\n        const hr = hl - slant;\n        houses.push({ x, w, hl, hr });\n        const base = Math.min(hl, hr), cols = Math.max(1, Math.floor((w - 8) / 11)), rows = Math.max(0, Math.floor((base - 14) / 15));\n        const x0 = x + (w - cols * 11) / 2 + 3.5;\n        for (let rr = 0; rr \u003c rows; rr++) for (let c = 0; c \u003c cols; c++) {\n          if (rand() \u003c d.lit) wins.push({ x: x0 + c * 11, y: H - base + 12 + rr * 15, ph: rand() * 6.28, sp: 0.5 + rand() * 1.8 });\n        }\n        x += w + rand() * 3;\n      }\n      return { ...d, houses, wins };\n    });\n    const n = Math.round(Math.min(46, W / 22));\n    embers = Array.from({ length: n }, () => ({ x: rand() * W, y: rand() * H, r: 0.5 + rand() * 1.5, vy: 0.12 + rand() * 0.35, sw: rand() * 6.28, a: 0.25 + rand() * 0.5 }));\n  }\n  function draw(t) {\n    ctx.clearRect(0, 0, W, H);\n    for (const e of embers) {\n      ctx.fillStyle = 'rgba(255,140,190,' + e.a.toFixed(2) + ')';\n      ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 6.283); ctx.fill();\n    }\n    for (const L of layers) {\n      ctx.fillStyle = L.fill;\n      for (const h of L.houses) {\n        ctx.beginPath(); ctx.moveTo(h.x, H); ctx.lineTo(h.x, H - h.hl); ctx.lineTo(h.x + h.w, H - h.hr); ctx.lineTo(h.x + h.w, H); ctx.closePath(); ctx.fill();\n      }\n      ctx.strokeStyle = L.rim; ctx.lineWidth = 1; ctx.beginPath();\n      for (const h of L.houses) { ctx.moveTo(h.x, H - h.hl); ctx.lineTo(h.x + h.w, H - h.hr); }\n      ctx.stroke();\n      for (const w of L.wins) {\n        const a = reduceMotion ? 0.75 : 0.5 + 0.4 * Math.sin(t * w.sp + w.ph);\n        ctx.fillStyle = 'rgba(255,111,174,' + (a * 0.9).toFixed(3) + ')'; ctx.fillRect(w.x, w.y, 4, 6);\n        ctx.fillStyle = 'rgba(255,111,174,' + (a * 0.14).toFixed(3) + ')'; ctx.fillRect(w.x - 3, w.y - 3, 10, 12);\n      }\n    }\n  }\n  function step(dt) {\n    for (const e of embers) {\n      e.y -= e.vy * dt / 16; e.x += Math.sin(last * 0.0006 + e.sw) * 0.25 * dt / 16;\n      if (e.y \u003c -4) { e.y = H + 4; e.x = Math.random() * W; }\n    }\n  }\n  function frame(now) {\n    raf = requestAnimationFrame(frame);\n    const dt = now - last; if (dt \u003c 32) return;\n    last = now; step(Math.min(dt, 100)); draw(now / 1000);\n  }\n  build(); draw(0);\n  if ('ResizeObserver' in window) new ResizeObserver(() => { build(); draw(performance.now() / 1000); }).observe(cv);\n  if (reduceMotion || !('IntersectionObserver' in window)) return;\n  new IntersectionObserver(es => {\n    if (es[0].isIntersecting) { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } }\n    else { cancelAnimationFrame(raf); raf = 0; }\n  }).observe(cv);\n})();\n"}</script>
